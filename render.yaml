
services:
  - type: web
    name: edu-ai-consulting-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # ?щ·留곸쑝濡??볦? ?곗씠?곌? ?щ같???ъ떆???꾩뿉???⑥븘?덈룄濡??곴뎄 ?붿뒪?ъ뿉 ??ν븳??
    # ?붿뒪?ш? ?놁쑝硫?而⑦뀒?대꼫 ?ъ떆????SQLite ?뚯씪??珥덇린?붾맂??
    disk:
      name: edu-ai-consulting-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required for signing login tokens. Set a unique value of at least
      # 32 characters in Render; never commit the secret itself.
      - key: JWT_SECRET_KEY
        sync: false
      - key: VIDEO_INGEST_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/edu_consulting.db

  # OSINT/EduIntel Next.js ??쒕낫??(app.ichapterwise.com).
