services:
  - type: web
    name: edu-ai-consulting-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # 크롤링으로 쌓은 데이터가 재배포/재시작 후에도 남아있도록 영구 디스크에 저장한다.
    # 디스크가 없으면 컨테이너 재시작 시 SQLite 파일이 초기화된다.
    disk:
      name: edu-ai-consulting-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required for signing login tokens. Set a unique value of at least
      # 32 characters in Render; never commit the secret itself.
      - key: JWT_SECRET_KEY
        sync: false
      - key: VIDEO_INGEST_API_KEY
        sync: false
      - key: NEWS_INGEST_API_KEY
        sync: false
      - key: CONTENT_INGEST_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/edu_consulting.db

  # OSINT/EduIntel Next.js 대시보드 (app.ichapterwise.com / doke-v.net).
  - type: web
    name: edu-ai-consulting-dashboard
    runtime: node
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    # AdSense 메인 사이트 도메인: doke-v.net (호스팅거 구입 도메인).
    # Render 대시보드에서도 같은 도메인을 추가 인증해야 하며,
    # 호스팅거 DNS를 Render 안내 IP/CNAME 으로 변경해야 한다.
    domains:
      - doke-v.net
      - www.doke-v.net
    envVars:
      - key: BACKEND_URL
        value: https://ichapterwise.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://ichapterwise.com
      # 학원 평판 관리자 페이지(/reputation) 게이트 — Render 대시보드에서 직접 값을 설정할 것.
      # 미설정 시 /api/reputation/[...path] 프록시가 관리 엔드포인트를 전부 차단한다(안전 기본값).
      - key: ADMIN_ACCESS_TOKEN
        sync: false
      # AdSense 게시자 ID — AdSense 가입 후 받은 pub-XXXXXXXXXXXXXXXX 값을
      # Render 대시보드에서 직접 설정 (sync:false → 커밋 금지, 대시보드에서만 관리).
      - key: NEXT_PUBLIC_ADSENSE_PUBLISHER_ID
        sync: false
      - key: NEXT_PUBLIC_SITE_DOMAIN
        value: doke-v.net
      - key: NEXT_PUBLIC_ADS_ENABLED
        value: "true"

  # AI 교육뉴스 커뮤니티·맘카페 프론트엔드 (Vite+React 정적 빌드).
  # 기존 dashboard/(OSINT용 Next.js 대시보드, app.ichapterwise.com)와는 별개 서비스.
  # AdSense 2차 사이트: community.doke-v.net
  - type: web
    name: edu-ai-consulting-community
    runtime: static
    rootDir: dashboard-community
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    domains:
      - community.doke-v.net
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ichapterwise.com
      # AdSense 게시자 ID — AdSense 가입 후 Render 대시보드에서 직접 설정 (커밋 금지).
      - key: VITE_ADSENSE_PUBLISHER_ID
        sync: false
      - key: VITE_SITE_DOMAIN
        value: doke-v.net
      - key: VITE_ADS_ENABLED
        value: "true"
    routes:
      # React Router의 클라이언트 사이드 라우팅을 위해 모든 경로를 index.html로 폴백.
      - type: rewrite
        source: /*
        destination: /index.html

  # Buzz 릴레이 — 내부 HQ (buzz.ichapterwise.com). 팀+AI직원 협업 워크스페이스.
  # block/buzz (Apache 2.0) 기반. Docker 이미지 래퍼(buzz/Dockerfile) 사용.
  - type: web
    name: edu-ai-consulting-buzz
    runtime: docker
    dockerfilePath: ./buzz/Dockerfile
    # 릴레이는 Postgres+Redis+MinIO 를 요구하므로 저사양 이상 인스턴스 권장.
    plan: starter  # 메모리 부족 시 standard 로 상향
    healthCheckPath: /_liveness
    envVars:
      - key: BUZZ_IMAGE
        value: ghcr.io/block/buzz:main
      - key: BUZZ_DOMAIN
        value: buzz.ichapterwise.com
      - key: RELAY_URL
        value: wss://buzz.ichapterwise.com
      - key: BUZZ_MEDIA_BASE_URL
        value: https://buzz.ichapterwise.com/media
      - key: BUZZ_MEDIA_SERVER_DOMAIN
        value: buzz.ichapterwise.com
      - key: BUZZ_CORS_ORIGINS
        value: https://buzz.ichapterwise.com,https://ichapterwise.com
      - key: BUZZ_REQUIRE_AUTH_TOKEN
        value: "true"
      - key: BUZZ_REQUIRE_RELAY_MEMBERSHIP
        value: "true"
      - key: BUZZ_ALLOW_NIP_OA_AUTH
        value: "true"
      - key: BUZZ_AUTO_MIGRATE
        value: "true"
      - key: BUZZ_GIT_CONFORMANCE_PROBE
        value: "true"
      - key: BUZZ_S3_ADDRESSING_STYLE
        value: path
      - key: BUZZ_S3_BUCKET
        value: buzz-media
      # --- secret (Render 대시보드에서 직접 설정, 절대 커밋 금지) ---
      - key: RELAY_OWNER_PUBKEY
        sync: false
      - key: BUZZ_RELAY_PRIVATE_KEY
        sync: false
      - key: BUZZ_GIT_HOOK_HMAC_SECRET
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: BUZZ_S3_ACCESS_KEY
        sync: false
      - key: BUZZ_S3_SECRET_KEY
        sync: false
