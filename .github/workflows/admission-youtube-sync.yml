
name: Sync admission YouTube videos

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: admission-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crawler
    env:
      API_BASE_URL: https://ichapterwise.com
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      VIDEO_INGEST_API_KEY: ${{ secrets.VIDEO_INGEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements-news.txt
      - run: pip install -r requirements-news.txt
      - run: python sync_admission_videos.py

