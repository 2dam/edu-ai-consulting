
name: Sync education news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: education-news-sync
  cancel-in-progress: false

jobs:
  sync:
    environment: YOUTUBE_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crawler
    env:
      SCRAPY_SETTINGS_MODULE: edu_crawler.settings_news
      NEWS_EXPORT_API_URL: https://ichapterwise.com/news/ingest
      NEWS_INGEST_API_KEY: ${{ secrets.VIDEO_INGEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements-news.txt
      - run: pip install -r requirements-news.txt
      - name: Collect Ministry of Education news
        run: >-
          python -m scrapy crawl education_news
          -a start_url="https://www.moe.go.kr/boardCnts/listRenew.do?boardID=294&m=020402&s=moe"
          -a category="정책"
