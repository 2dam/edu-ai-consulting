
name: Sync NEIS education facilities

on:
  schedule:
    - cron: "23 18 * * 0"
  workflow_dispatch:

concurrency:
  group: education-facilities-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: crawler
    env:
      SCRAPY_SETTINGS_MODULE: edu_crawler.settings_facilities
      EXPORT_API_URL: https://ichapterwise.com/ingest
      VIDEO_INGEST_API_KEY: ${{ secrets.VIDEO_INGEST_API_KEY }}
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements-news.txt
      - run: pip install -r requirements-news.txt
      - name: Sync academies nationwide
        run: python -m scrapy crawl early_education -a facility_type=academy -a region_code=all
      - name: Sync elementary schools nationwide
        run: python -m scrapy crawl early_education -a facility_type=elementary -a region_code=all
